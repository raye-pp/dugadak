<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>두가닥</title>
<style>
:root{--bg:#EEF0F3;--card:#fff;--ink:#1E2433;--muted:#5D6575;--line:#D3D8E1;--a:#3A4FA0;--b:#D9A21B;--err:#C8432E}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--card:#1B1F29;--ink:#E9ECF2;--muted:#9AA2B3;--line:#323949;--a:#8A9CE8;--b:#E8B83C;--err:#F07A63;color-scheme:dark}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.t{height:6px;border-radius:3px;background:repeating-linear-gradient(115deg,var(--a) 0 7px,var(--b) 7px 14px)}
h1{margin:0;font-size:20px} p{margin:0;font-size:13px;color:var(--muted)}
input{font-size:24px;letter-spacing:.5em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button{font-size:15px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5}
.e{color:var(--err);font-size:13px;min-height:1em}
input:focus-visible,button:focus-visible{outline:2px solid var(--b);outline-offset:2px}
</style></head>
<body>
<form id="f" autocomplete="off">
  <div class="t"></div>
  <h1>두가닥</h1>
  <p>비공개 구상 자료예요. 암호를 입력해 주세요.</p>
  <input id="pw" type="password" inputmode="numeric" maxlength="12" aria-label="암호" autofocus>
  <div class="e" id="e" role="alert"></div>
  <button id="go" type="submit">열기</button>
</form>

function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw,silent){
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.i,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.n)},key,u(D.c));
    try{sessionStorage.setItem("dg_pw",pw)}catch(e){}
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
    if(location.hash){var h=location.hash;location.hash="";location.hash=h;}
  }catch(err){
    try{sessionStorage.removeItem("dg_pw")}catch(e){}
    if(!silent){document.getElementById("e").textContent="암호가 맞지 않아요. 다시 입력해 주세요.";document.getElementById("go").disabled=false;document.getElementById("pw").select();}
  }
}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();var b=document.getElementById("go");b.disabled=true;document.getElementById("e").textContent="여는 중…";
  open_(document.getElementById("pw").value,false);
});
try{var saved=sessionStorage.getItem("dg_pw");if(saved)open_(saved,true)}catch(e){}
